name: Update requirements.txt Dependencies

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-deps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install pip-tools
        run: pip install pip-tools

      - name: Resolve and compile latest versions
        id: compile
        run: |
          # pip-compile 会读取 requirements.txt 中未锁版本的包，
          # 解析最新兼容版本并写入带版本号的 requirements.txt
          # --upgrade 强制取最新版本，--no-emit-comments 保持文件干净
          pip-compile --upgrade --no-emit-comments --output-file requirements.txt requirements.txt || true

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet requirements.txt; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No dependency updates available."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --no-color requirements.txt
          fi

      - name: Create branch & commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="deps/update-requirements-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add requirements.txt
          git commit -m "chore(deps): auto-update requirements.txt" -m "Automated dependency update via pip-compile --upgrade."
          git push origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_ENV"

      - name: Create Pull Request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_BODY=$(cat <<'EOF'
          ## 🤖 Automated Dependency Update

          This PR was automatically generated by the `update-deps` workflow.

          ### What changed
          - Updated package versions in `requirements.txt` to the latest compatible releases
          - Generated with `pip-compile --upgrade`

          ### Diff
          ```diff
          $(git diff origin/main -- requirements.txt)
          ```

          ---
          *Auto-generated by the [Update requirements.txt Dependencies](https://github.com/${{ github.repository }}/actions/workflows/update-deps.yml) workflow*
          EOF
          )

          gh pr create \
            --head "$branch" \
            --base main \
            --title "chore(deps): update requirements.txt" \
            --body "$PR_BODY" \
            --label "dependencies"

      - name: Auto-merge PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          gh pr merge --auto --merge "$branch" --delete-branch || \
            echo "Auto-merge requires PAT_TOKEN; PR will remain open for manual merge."
